name: Tracer

options:
  bundleIdPrefix: com.tracer
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

targets:
  TracerApp:
    type: application
    platform: macOS
    sources:
      - path: TracerApp
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: TracerApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TracerApp/TracerApp.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.tracer.Tracer
        PRODUCT_NAME: Tracer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
    dependencies:
      - target: TracerExtension
        embed: true
        codeSign: true

  TracerExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TracerExtension
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: TracerExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TracerExtension/TracerExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.tracer.Tracer.TracerExtension
        PRODUCT_NAME: TracerExtension
        SWIFT_OBJC_BRIDGING_HEADER: TracerExtension/TracerExtension-Bridging-Header.h
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_CXX_LIBRARY: libc++
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        SKIP_INSTALL: YES
